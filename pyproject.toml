[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mysglang"
version = "0.1.0"
description = "A compact reference implementation of a paged, radix-cached LLM server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4,<3",
]

[project.scripts]
mysglang-chat = "mysglang.cli:main"
mysglang-serve = "mysglang.server:main"
mysglang-deepseek = "mysglang.deepseek_cli:main"

[project.optional-dependencies]
deepseek = [
    "torch>=2.13,<3",
    "numpy>=1.26",
    "safetensors>=0.8,<1",
    "tokenizers>=0.22,<1",
    "triton>=3.7,<4",
]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
serve = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn>=0.30",
]
model = [
    "numpy>=1.26",
    "huggingface-hub>=1,<2",
    "safetensors>=0.8,<1",
    "transformers>=5,<6",
]
vision = [
    "numpy>=1.26",
    "pillow>=10",
]
flashinfer = [
    "flashinfer-python>=0.7,<0.8",
    "triton>=3,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
